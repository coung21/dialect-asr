[project]
name = "dialect-asr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.1.0",
    "datasets[audio]>=4.0.0",
    "hydra-core>=1.3.5",
    "jiwer>=4.0.0",
    "numpy>=2.0.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "wandb>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pandas>=3.0.5",
]
