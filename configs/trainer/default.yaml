# Shared hyperparameters for baseline and future fusion experiments.
output_dir: outputs/phowhisper-baseline

num_train_epochs: 15
learning_rate: 1.0e-5
optimizer: adamw_torch
weight_decay: 0.005
warmup_ratio: 0.1

# On the default 1-GPU setup: batch 8 with no gradient accumulation.
global_train_batch_size: 8
per_device_train_batch_size: 8
per_device_eval_batch_size: 4

max_grad_norm: 1.0
logging_steps: 25
save_total_limit: 2
dataloader_num_workers: 4
group_by_length: true
length_column_name: length
seed: 42
# Must remain false on CUDA: full determinism is not guaranteed for every kernel.
full_determinism: false

fp16: false
bf16: false
tf32: null
gradient_checkpointing: false
# Greedy decoding by default; raise for beam search at eval-time cost.
generation_max_length: 225
generation_num_beams: 1
metric_for_best_model: eval_loss
greater_is_better: false
report_to: wandb
run_name: phowhisper-baseline

# W&B experiment tracking. API keys must come from `wandb login` or WANDB_API_KEY.
wandb_project: dialect-asr
wandb_entity: null
wandb_group: baseline
wandb_tags: [vimd, phowhisper, baseline]
wandb_mode: online       # online | offline | disabled
wandb_log_model: "end"   # Upload exactly one final artifact after training.
wandb_watch: "false"     # false | gradients | all
use_cpu: false
