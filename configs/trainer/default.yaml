# Shared hyperparameters for baseline and future fusion experiments.
output_dir: outputs/wav2vec2-baseline

num_train_epochs: 15
learning_rate: 1.0e-4
optimizer: adamw_torch
weight_decay: 0.005
warmup_ratio: 0.1

# Effective batch = per_device batch * world_size * gradient accumulation.
global_train_batch_size: 8
per_device_train_batch_size: 4
per_device_eval_batch_size: 4

max_grad_norm: 1.0
logging_steps: 25
save_total_limit: 2
dataloader_num_workers: 4
group_by_length: true
length_column_name: length
seed: 42
# Must remain false on CUDA: ctc_loss_backward_gpu is non-deterministic.
full_determinism: false

fp16: false
bf16: false
tf32: null
gradient_checkpointing: false
metric_for_best_model: eval_loss
greater_is_better: false
report_to: wandb
run_name: wav2vec2-baseline

# W&B experiment tracking. API keys must come from `wandb login` or WANDB_API_KEY.
wandb_project: dialect-asr
wandb_entity: null
wandb_group: baseline
wandb_tags: [vimd, wav2vec2, baseline]
wandb_mode: online       # online | offline | disabled
wandb_log_model: "end"   # Upload exactly one final artifact after training.
wandb_watch: "false"     # false | gradients | all
use_cpu: false
