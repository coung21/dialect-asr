architecture: dggfm
pretrained_model_name: nguyenvulebinh/wav2vec2-base-vi-vlsp2020

freeze_feature_encoder: true
freeze_base_model: false
gradient_checkpointing: false
local_files_only: false

# Transformer blocks are numbered from 1 to 12.
branch_block: 6
fusion_blocks: [6, 8, 10, 12]

num_regions: 3
dialect_bottleneck_size: 256
dialect_dropout: 0.1
dialect_dim: 64
temperature: 1.0
gate_hidden_dim: 256
dialect_loss_weight: 0.1
